name: Release

# Tag-driven release of the three packages that may be published right now (Phase 7 amendment 2):
#   aegis-skills@X.Y.Z, @aegis-skills/themis-core@X.Y.Z, @aegis-skills/themis-gateway@X.Y.Z
# Create the tag with `git tag -a` (annotated only) on a commit that is on main, then push ONE tag at a time, in this order:
# aegis-skills, themis-core, themis-gateway. Step-by-step: docs/RELEASE-RUNBOOK.md.
#
# The npm trusted publisher of each package is bound to this exact filename (release.yml) and to the environment
# npm-publish. Do not rename either without reconfiguring the trusted publishers on npmjs.com (the fields cannot be edited).
#
# Tags of any other package (@aegis-skills/themis-plugin, @aegis-skills/themis) do not start this workflow on purpose.
# If one is released through workflow_dispatch, the resolve job fails with an explanation until Phase 8 widens
# RELEASABLE in scripts/lib/release-manifests.js (and the allow-list in the resolve job below).
on:
  push:
    tags:
      - 'aegis-skills@*'
      - '@aegis-skills/themis-core@*'
      - '@aegis-skills/themis-gateway@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag to (re)release, e.g. aegis-skills@1.5.0. A version already on npm is not republished.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.meta.outputs.name }}
      dir: ${{ steps.meta.outputs.dir }}
      key: ${{ steps.meta.outputs.key }}
      version: ${{ steps.meta.outputs.version }}
      latest: ${{ steps.meta.outputs.latest }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
    steps:
      - name: Tag format and release allow-list
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^(aegis-skills|@aegis-skills/[a-z-]+)@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not <npm-name>@X.Y.Z"
            exit 1
          fi
          # Keep in step with RELEASABLE in scripts/lib/release-manifests.js (a test compares them).
          case "${RELEASE_TAG%@*}" in
            aegis-skills|@aegis-skills/themis-core|@aegis-skills/themis-gateway) ;;
            *)
              echo "::error::'${RELEASE_TAG%@*}' is not releasable yet. Releasable packages: aegis-skills, @aegis-skills/themis-core, @aegis-skills/themis-gateway. The Themis plugin and app are published from Phase 8."
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag must be annotated and point at a commit on main
        run: |
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "::error::$RELEASE_TAG is a lightweight tag. Create it with: git tag -a $RELEASE_TAG -m $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::$RELEASE_TAG is not on main"; exit 1; }
      - id: meta
        name: Tag, version files and package versions agree (check-versions --tag)
        run: node scripts/check-versions.js --tag "$RELEASE_TAG"

  verify:
    name: Verify ${{ needs.resolve.outputs.name }}@${{ needs.resolve.outputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PKG_KEY: ${{ needs.resolve.outputs.key }}
      PKG_DIR: ${{ needs.resolve.outputs.dir }}
    steps:
      # No secrets in this job. npm ci and the project scripts run here, never next to the publish credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Lint, guards and tests
        run: |
          npm run check:layout
          npm run check:versions
          npm run lint:skills
          npm run check:deps
          npm run test:scripts
          for d in themis-core themis-gateway themis-plugin themis-app; do
            if [ -f "packages/$d/package.json" ]; then npm run build --workspace "packages/$d" --if-present; fi
          done
          npm test
      - name: Assert tarball contents
        run: node scripts/assert-pack.js "$PKG_KEY"
      - name: npm publish --dry-run
        run: |
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; dry run skipped"
          else
            npm publish --dry-run --ignore-scripts --workspace "$PKG_DIR"
          fi
      - name: Pack the exact tarball to publish
        run: node scripts/pack-to.js "$PKG_KEY" dist-release/npm
      - name: Build release assets
        run: node scripts/build-release-assets.js --package "$PKG_KEY" --out dist-release/assets --npm-tarball "$(ls dist-release/npm/*.tgz)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: dist-release/npm/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist-release/assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
      # True only while the one-time bootstrap token exists in the npm-publish environment (first publish of a package).
      HAS_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN != '' }}
    steps:
      # This job runs no project code and no install scripts: it downloads the tarball that verify built and checked,
      # and hands it to npm. The checkout is sparse and only provides scripts/wait-for-deps.js.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sparse-checkout: scripts/wait-for-deps.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm must be >= 11.5.1 for trusted publishing (Node 24 ships 11.x; pinned 11.21.0 only if older)
        run: |
          npm --version
          if node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=1))))?0:1)' "$(npm --version)"; then
            echo "runner npm is new enough"
          else
            npm install -g npm@11.21.0 && npm --version
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist-release/npm
      - name: Check the tarball identity
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          tar -xzf dist-release/npm/*.tgz -C "$RUNNER_TEMP/meta" package/package.json
          node -e 'const p=require(process.argv[1]); if (p.name!==process.env.NAME||p.version!==process.env.VERSION) { console.error(`tarball is ${p.name}@${p.version}`); process.exit(1) }' "$RUNNER_TEMP/meta/package/package.json"
      - id: exists
        name: Skip versions already on npm
        run: |
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "$NAME@$VERSION is already on npm; not republishing"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for internal dependencies on the registry (themis-gateway needs themis-core)
        if: steps.exists.outputs.published == 'false'
        run: node scripts/wait-for-deps.js "$RUNNER_TEMP/meta/package/package.json" --timeout-min 20
      - name: Publish with provenance (trusted publishing, OIDC)
        if: steps.exists.outputs.published == 'false' && env.HAS_BOOTSTRAP_TOKEN != 'true'
        run: |
          cd dist-release/npm
          npm publish ./*.tgz --provenance --access public --tag latest
      - name: Publish with provenance (one-time bootstrap token, first version of a new package)
        if: steps.exists.outputs.published == 'false' && env.HAS_BOOTSTRAP_TOKEN == 'true'
        env:
          # Environment secret. Delete it once the trusted publisher is configured and validated (docs/RELEASE-RUNBOOK.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          cd dist-release/npm
          npm publish ./*.tgz --provenance --access public --tag latest

  github-release:
    name: GitHub Release
    needs: [resolve, verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      PREV_TAG: ${{ needs.resolve.outputs.prev_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist-release/assets
      - name: Write release notes
        run: |
          NOTES_FILE=".github/release-notes/${RELEASE_TAG//\//__}.md"
          if [ -f "$NOTES_FILE" ]; then echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"; fi
          {
            if [ -f "$NOTES_FILE" ]; then cat "$NOTES_FILE"; echo; fi
            echo "**npm:** https://www.npmjs.com/package/$NAME/v/$VERSION (published by this workflow with npm provenance)"
            echo
            echo 'Verify downloads with `sha256sum -c SHA256SUMS`.'
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-release/assets/* --clobber
          else
            ARGS=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
            # Generated notes list commits. With no earlier tag that is the whole history, so the first release uses only its own notes file.
            if [ -n "$PREV_TAG" ]; then ARGS+=(--generate-notes --notes-start-tag "$PREV_TAG"); elif [ -z "${NOTES_FILE:-}" ]; then ARGS+=(--generate-notes); fi
            gh release create "$RELEASE_TAG" "${ARGS[@]}" dist-release/assets/*
          fi

  smoke:
    name: Smoke test from npm (${{ matrix.os }})
    needs: [resolve, publish]
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NAME: ${{ needs.resolve.outputs.name }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PKG_KEY: ${{ needs.resolve.outputs.key }}
      AEGIS_NO_AUTO_REFRESH: '1'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Wait for the registry, then install the published version into a clean project
        run: |
          # The registry and its CDN can lag a few minutes behind a publish: retry with backoff.
          for i in $(seq 1 40); do npm view "$NAME@$VERSION" version > /dev/null 2>&1 && break; sleep 15; done
          npm view "$NAME@$VERSION" version > /dev/null 2>&1 || { echo "::error::$NAME@$VERSION is not visible on npm after 10 minutes"; exit 1; }
          T=$(node -p "process.env.RUNNER_TEMP.split(require('path').sep).join('/')")
          mkdir -p "$T/smoke" "$T/home" && cd "$T/smoke"
          npm init -y > /dev/null
          for i in 1 2 3 4 5; do
            npm install --no-audit --no-fund "$NAME@$VERSION" && break
            [ "$i" = 5 ] && { echo "::error::npm install $NAME@$VERSION failed 5 times"; exit 1; }
            sleep $((i * 20))
          done
          node -e "require('fs').accessSync('node_modules/' + process.env.NAME + '/package.json')"
          case "$PKG_KEY" in
            aegis)
              OUT=$(npx --no -- aegis --version); echo "aegis --version -> $OUT"
              case "$OUT" in *"$VERSION"*) ;; *) echo "::error::expected $VERSION"; exit 1 ;; esac
              HOME="$T/home" USERPROFILE="$T/home" npx --no -- aegis install --platform claude --project
              EXPECTED=$(node -p "require('fs').readdirSync('node_modules/aegis-skills/skills',{withFileTypes:true}).filter(e=>e.isDirectory()).length")
              GOT=$(node -p "const fs=require('fs');fs.readdirSync('.claude/skills',{withFileTypes:true}).filter(e=>e.isDirectory()&&fs.existsSync('.claude/skills/'+e.name+'/SKILL.md')).length")
              echo "skills installed: $GOT / $EXPECTED"
              test "$GOT" = "$EXPECTED" ;;
            *)
              node -e "const m=require(process.env.NAME); console.log(process.env.NAME, 'exports', Object.keys(m).length, 'names'); if (!Object.keys(m).length) process.exit(1)" ;;
          esac
      - name: Registry signatures and provenance attestation
        run: |
          T=$(node -p "process.env.RUNNER_TEMP.split(require('path').sep).join('/')")
          cd "$T/smoke"
          for i in 1 2 3 4 5 6; do
            npm audit signatures | tee audit.txt && grep -qi "verified attestation" audit.txt && exit 0
            sleep $((i * 20))
          done
          echo "::error::no verified provenance attestation for $NAME@$VERSION"
          exit 1
